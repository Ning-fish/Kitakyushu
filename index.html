<div class="card"><h2>📶 eSIM</h2><small>到日本再掃描啟用,使用說明截圖在 Notion。</small></div>
<div class="card"><h2>🛍️ 退稅</h2><small>下載「JPrefund」App,退稅步驟截圖在 Notion。</small></div>

const T=[['ov','🏠 總覽'],...D.map(d=>[d.id,d.tab]),['pack','🎒 行李'],['tips','📝 小抄']];
const nav=document.getElementById('nav'),v=document.getElementById('v');
nav.innerHTML=T.map(([k,n])=>`<button data-go="${k}">${n}</button>`).join('');

const P={ov:[4,'小金','歡迎來九州!先看看四天重點,再把待辦一項一項勾掉吧。'],pack:[0,'小柴','出門前一項一項勾,別忘了護照和駕照喔!'],tips:[2,'小松','入境、網路、退稅,先在這裡看一遍就不慌了。']};v.innerHTML=(P[k]?sayBox(...P[k]):'')+(k==='ov'?ov():d?day(d):k==='pack'?pack():tips());
nav.querySelectorAll('button').forEach(b=>{const on=b.dataset.go===k;b.classList.toggle('on',on);if(on)b.scrollIntoView({inline:'center',block:'nearest'})});
if(k==='pack')pstat();try{history.replaceState(null,'','#'+k)}catch(e){}window.scrollTo(0,0)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)show(g.dataset.go)});

document.getElementById('th').onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark'};

const dep=Date.UTC(2026,10,25,19,0),ms=dep-n,c=document.getElementById('cd');
c.textContent=ms>0?'⏳ 距離出發 '+Math.ceil(ms/864e5)+' 天':'🌸 旅途進行中';}
tick();setInterval(tick,30000);
const h=location.hash.slice(1);let st='ov';if(h)st=h;else{const j=new Date(Date.now()+(9*60-new Date().getTimezoneOffset()*-1)*0).toLocaleDateString('en-CA',{timeZone:'Asia/Tokyo'});const m={'2026-11-26':'d1','2026-11-27':'d2','2026-11-28':'d3','2026-11-29':'d4'};if(m[j])st=m[j]}
document.getElementById('mh').innerHTML=['小柴','小紗','小松','小基','小金'].map((n,i)=>`<span>${mk(i,52)}<small>${n}</small></span>`).join('');
show(st);
