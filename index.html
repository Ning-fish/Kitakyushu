const TD=['10/29 後預約牛腸鍋田州(小倉晚餐)','填寫 Visit Japan Web','下載 JPrefund(退稅)','設定 eSIM','確認 AVIS 租車(11/27 9:30)','準備駕照 + 日文譯本'];
const sayBox=(i,n,t)=>`<div class="say"><span class="av">${mk(i,64)}</span><div><b>${n}</b><br>${t}</div></div>`;
function todo(){let s={};try{s=JSON.parse(localStorage.getItem('pk')||'{}')}catch(e){}return `<div class="card pk"><h2>出發前待辦</h2>${TD.map(x=>`<label><input type="checkbox" data-k="${x}"${s[x]?' checked':''}><span>${x}</span></label>`).join('')}</div>`}
const a=(u,t)=>`<a class="go" href="${u}" target="_blank" rel="noopener">${t}</a>`;
const items=l=>l.map(([n,d,u])=>{const [x,y]=d.split('|');const tg=y?`<span class="tag">${y.split(',')[0]}</span>`:'';const ex=y?y.split(',').slice(1).join(','):'';return `<div class="item"><div><b>${n}${tg}</b><small>${[x,ex].filter(Boolean).join('・')}</small></div>${u?a(u,u.includes('maps')?'地圖':'連結'):''}</div>`}).join('');
function ov(){return `<div class="card"><h2>✈️ 航班</h2><div class="item"><div><b>去程 7G800・11/26(四)</b><small>03:00 桃園 T1(2 號櫃台) → 06:15 北九州機場・2 小時 15 分</small></div></div><div class="item"><div><b>回程 7G801・11/29(日)</b><small>23:50 北九州機場(2 樓出境大廳報到) → 01:30 桃園 T1・2 小時 40 分</small></div></div><small>確認單:SE8A2A / AAAG5G</small></div>
<div class="card"><h2>🏨 住宿</h2><div class="item"><div><b>小倉・ART 新田川小倉酒店</b><small>11/26 15:00 入住 → 11/28 11:00 退房</small></div>${a(M('uMDUjdTCASNLMgZm6'),'地圖')}</div><div class="item"><div><b>由布院・YUNOA Yufuin</b><small>11/28 15:00-18:00 入住 → 11/29 10:00 退房</small></div>${a(M('4fCuD9zhzH2UXnFz5'),'地圖')}</div></div>
<h2 class="sec">四天重點</h2><div class="grid">${D.map(d=>`<button class="mini" data-go="${d.id}">${mk(d.c[0],40)}<b>${d.tab}</b><small>${H[d.id]}</small></button>`).join('')}</div>${todo()}`}
function day(d){return `<div class="say"><span class="av">${mk(d.c[0],64)}</span><div><b>${d.c[1]}</b><br>${d.c[2]}</div></div><div class="card"><h2>${d.t}</h2><div class="route">${d.r.map((s,i)=>(i?'<i>→</i>':'')+`<span>${s}</span>`).join('')}</div></div>`+d.S.map(([h,l])=>`<h2 class="sec">${h}</h2><div class="card">${items(l)}</div>`).join('')}
function pack(){let s={};try{s=JSON.parse(localStorage.getItem('pk')||'{}')}catch(e){}
const tot=PK.reduce((n,g)=>n+g[1].length,0);
return `<div class="card"><h2>🎒 行李清單 <span id="pc"></span></h2><div class="bar"><div id="pb"></div></div></div>`+PK.map(([h,l])=>`<div class="card pk"><h2>${h}</h2>${l.map(x=>`<label><input type="checkbox" data-k="${x}"${s[x]?' checked':''}><span>${x}</span></label>`).join('')}</div>`).join('')}
function pstat(){const c=[...document.querySelectorAll('.pk input')];const n=c.filter(x=>x.checked).length;document.getElementById('pc').textContent=n+' / '+c.length;document.getElementById('pb').style.width=(n/c.length*100)+'%'}
function tips(){return `<div class="card"><h2>🛬 入境</h2><div class="item"><div><b>Visit Japan Web</b><small>入境前先填好,截圖保存 QR code</small></div>${a('https://www.vjw.digital.go.jp/main/#/vjwplo001','填寫')}</div></div>
<div class="card"><h2>📶 eSIM</h2><small>到日本再掃描啟用,使用說明截圖在 Notion。</small></div>
<div class="card"><h2>🛍️ 退稅</h2><small>下載「JPrefund」App,退稅步驟截圖在 Notion。</small></div>
<div class="card"><h2>🚗 開車提醒</h2><ul><li>11/27 9:30 AVIS 取車,11/29 18:00 前還車</li><li>帶護照、駕照、日文譯本</li><li>11/29 由布院退房後車可停到 14:00</li></ul></div>`}
const T=[['ov','🏠 總覽'],...D.map(d=>[d.id,d.tab]),['pack','🎒 行李'],['cash','💴 記帳'],['chk','🛃 檢疫'],['tips','📝 小抄']];
const nav=document.getElementById('nav'),v=document.getElementById('v');
nav.innerHTML=T.map(([k,n])=>`<button data-go="${k}">${n}</button>`).join('');
function show(k){if(!T.some(t=>t[0]===k))k='ov';const d=D.find(x=>x.id===k);
const P={ov:[1,'魚子','準備好要出花了嘛｡:.ﾟヽ(*´∀`)ﾉﾟ.:｡ 記得完成出國前待辦哦!'],pack:[0,'凱凱','該帶的有沒有準備好呀!! 護照/駕照/日文譯本'],cash:[4,'小語','記帳沒 wooga!'],chk:[3,'毛茲','毛茲喜歡買東西 但不喜歡被沒收きょう'],tips:[1,'魚子','入境、ESIM、退稅,小功略都在這d(`･∀･)b']};v.innerHTML=(P[k]?sayBox(...P[k]):'')+(k==='ov'?ov():d?day(d):k==='pack'?pack():k==='cash'?cash():k==='chk'?chk():tips());
nav.querySelectorAll('button').forEach(b=>{const on=b.dataset.go===k;b.classList.toggle('on',on);if(on)b.scrollIntoView({inline:'center',block:'nearest'})});
if(k==='pack')pstat();if(k==='cash')xr();if(k==='chk')cf();try{history.replaceState(null,'','#'+k)}catch(e){}window.scrollTo(0,0)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)show(g.dataset.go)});
document.addEventListener('change',e=>{const k=e.target.dataset.k;if(!k)return;let s={};try{s=JSON.parse(localStorage.getItem('pk')||'{}');s[k]=e.target.checked;localStorage.setItem('pk',JSON.stringify(s))}catch(x){}pstat()});
const MB=['魚子','凱凱','月裕'],esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=()=>{try{return JSON.parse(localStorage.getItem('ex')||'[]')}catch(e){return[]}},sv=x=>{try{localStorage.setItem('ex',JSON.stringify(x))}catch(e){}},lr=()=>{try{return localStorage.getItem('rt')||'0.21'}catch(e){return'0.21'}};
let LT='';
function cash(){return `<div class='card f'><h2>新增消費</h2><input id='xn' placeholder='項目(例如 午餐)'><input id='xa' type='number' inputmode='numeric' placeholder='金額(日圓)'><label>付款人</label><select id='xp'>${MB.map(m=>`<option>${m}</option>`).join('')}</select><div id='xs' style='margin-top:6px'><small>分攤者</small><br>${MB.map(m=>`<label><input type='checkbox' value='${m}' checked>${m}</label>`).join('')}</div><button class='go' data-act='add' style='margin-top:8px'>記下來</button> <small id='xm'></small></div><div class='card f'><label>匯率:1 日圓 ≈ NT$</label><input id='xr' type='number' step='0.001' value='${lr()}'><small>匯率請依實際刷卡或換匯情況自行修改。記帳資料只存在這支手機的瀏覽器裡。</small></div><div id='xl'></div>`}
function xr(){const X=ld(),rt=+lr()||0,T$=Math.round(X.reduce((s,e)=>s+e.a,0)),b={},pd={};MB.forEach(m=>{b[m]=0;pd[m]=0});X.forEach(e=>{b[e.p]+=e.a;pd[e.p]+=e.a;e.s.forEach(m=>b[m]-=e.a/e.s.length)});const cr=MB.filter(m=>b[m]>.5).map(m=>[m,b[m]]),db=MB.filter(m=>b[m]<-.5).map(m=>[m,-b[m]]),tr=[];let i=0,j=0;while(i<db.length&&j<cr.length){const x=Math.min(db[i][1],cr[j][1]);tr.push([db[i][0],cr[j][0],x]);db[i][1]-=x;cr[j][1]-=x;if(db[i][1]<.5)i++;if(cr[j][1]<.5)j++}
const nt=y=>'NT$'+Math.round(y*rt).toLocaleString(),yn=y=>'¥'+Math.round(y).toLocaleString();
LT='日本旅費結算(合計 '+yn(T$)+'):'+(tr.map(t=>t[0]+' 付給 '+t[1]+' '+yn(t[2])+'('+nt(t[2])+')').join('、')||'不用互相轉帳');
document.getElementById('xl').innerHTML=`<div class='card'><h2>結算</h2><div class='big'>${yn(T$)} <small>≈ ${nt(T$)}</small></div>${MB.map(m=>`<div class='item'><div><b>${m}</b><small>先付 ${yn(pd[m])}</small></div><b>${b[m]>=0?'可收 ':'要付 '}${yn(Math.abs(b[m]))}</b></div>`).join('')}${tr.length?'<h2 style="margin-top:10px">誰轉給誰</h2>'+tr.map(t=>`<div class='item'><b>${t[0]} → ${t[1]}</b><b>${yn(t[2])} <small>(${nt(t[2])})</small></b></div>`).join(''):''}<button class='go' data-act='copy'>複製結算文字</button></div><div class='card'><h2>明細(${X.length})</h2>${X.length?X.map((e,i)=>`<div class='item'><div><b>${esc(e.n)}</b><small>${e.p} 付・分攤:${e.s.join('、')}</small></div><div style='text-align:right'><b>${yn(e.a)}</b><br><button class='go' data-del='${i}'>刪除</button></div></div>`).reverse().join(''):'<small>還沒有紀錄</small>'}</div>`}
const CK=[['半熟蛋、溫泉蛋、溏心蛋','n','日本屬禽流感疫區,蛋類有疫病風險'],['火腿腸、香腸、臘腸、培根','n','肉製品,是常見違規品項'],['牛肉乾、肉乾','n','肉製品,是常見違規品項'],['含肉塊的拉麵、即食調理包、真空包裝肉品','n','即使真空包裝也不行'],['雞皮、燒肉便當','n','動物產品'],['含肉的寵物食品','n','動物產品'],['豬肉製品','n','違規可能被處高額罰款'],['新鮮水果、蔬菜','q','多數受限,請先查官方規定再決定'],['魚子醬、醃漬鮭魚卵等水產品','y','報導指可攜帶,仍建議主動申報']];
function chk(){return `<div class='card'><h2>入境台灣檢疫小幫手</h2><small>輸入商品或食物名稱查查看。內容整理自防檢署公告與新聞報導,只列常見品項,規定可能更新,最終以官方公告和入境檢疫櫃檯為準。</small></div><div class='card f'><input id='cq' placeholder='輸入關鍵字,例如 蛋、香腸、水果'><div id='cl'></div></div><div class='card'>${a('https://www.aphia.gov.tw/','前往動植物防疫檢疫署官網')}<br><small>https://www.aphia.gov.tw/</small></div>`}
function cf(){const q=document.getElementById('cq').value.trim(),S={n:['不可帶','#d9534f'],y:['可帶,建議申報','#4d9a2a'],q:['需確認','#c97a00']},l=CK.filter(r=>!q||r[0].includes(q)||r[2].includes(q));document.getElementById('cl').innerHTML=l.length?l.map(r=>`<div class='item'><div><b>${r[0]}</b><small>${r[2]}</small></div><span class='tag' style='background:${S[r[1]][1]};color:#fff'>${S[r[1]][0]}</span></div>`).join(''):'<small>清單裡沒有這項。不確定就到入境前的動植物檢疫櫃檯詢問或主動申報。</small>'}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-del]');if(!t)return;if(t.dataset.del!==undefined){const X=ld();X.splice(+t.dataset.del,1);sv(X);xr();return}
if(t.dataset.act==='add'){const g=id=>document.getElementById(id),n=g('xn').value.trim()||'消費',a=Math.round(+g('xa').value),p=g('xp').value,s=[...document.querySelectorAll('#xs input:checked')].map(i=>i.value);if(!(a>0)||!s.length){g('xm').textContent='請輸入金額並至少選一位分攤者';return}g('xm').textContent='';const X=ld();X.push({n,a,p,s});sv(X);g('xn').value='';g('xa').value='';xr()}
if(t.dataset.act==='copy'){try{navigator.clipboard.writeText(LT);t.textContent='已複製'}catch(x){}}});
document.addEventListener('input',e=>{if(e.target.id==='xr'){try{localStorage.setItem('rt',e.target.value)}catch(x){}xr()}if(e.target.id==='cq')cf()});
document.getElementById('th').onclick=()=>{const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark'};
function tick(){const n=new Date();document.getElementById('jp').textContent='🕒 日本現在 '+n.toLocaleTimeString('zh-TW',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hour12:false});
const dep=Date.UTC(2026,10,25,19,0),ms=dep-n,c=document.getElementById('cd');
c.textContent=ms>0?'⏳ 距離出發 '+Math.ceil(ms/864e5)+' 天':'🌸 旅途進行中';}
tick();setInterval(tick,30000);
const h=location.hash.slice(1);let st='ov';if(h)st=h;else{const j=new Date(Date.now()+(9*60-new Date().getTimezoneOffset()*-1)*0).toLocaleDateString('en-CA',{timeZone:'Asia/Tokyo'});const m={'2026-11-26':'d1','2026-11-27':'d2','2026-11-28':'d3','2026-11-29':'d4'};if(m[j])st=m[j]}
document.getElementById('mh').innerHTML=[1,0,2,3,4].map(i=>[i,['凱凱','魚子','月裕','毛茲','小語'][i]]).map(([i,n])=>`<span>${mk(i,52)}<small>${n}</small></span>`).join('');
show(st);
</script></body></html>
